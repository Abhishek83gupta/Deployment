version: "3.8"

services:
  mongodb:
    container_name: mongo
    image: mongo
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db    
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s  

  backend:
    container_name: backend
    build: ./Backend
    env_file: ./Backend/.env.local
    ports:
      - 3000:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped  
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s  

  frontend:
    container_name: frontend
    build: ./Frontend
    env_file: ./Frontend/.env.local
    ports:
      - 80:80
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped  
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
networks:
  app-network:
    - driver: bridge