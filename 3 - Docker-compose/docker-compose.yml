version: "3.8"

services:
  mongodb:
    container_name: mongo
    image: mongo
    ports:
      - 27017:27017
    networks:
      - app-network

  backend:
    container_name: backend
    build: ./Backend
    env_file: ./Backend/.env.local
    ports:
      - 3000:3000
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    container_name: frontend
    build: ./Frontend
    env_file: ./Frontend/.env.local
    ports:
      - 80:80
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    - driver: bridge